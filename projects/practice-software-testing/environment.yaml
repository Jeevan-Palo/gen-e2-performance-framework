name: practice-software-testing
base_url: https://practicesoftwaretesting.com/
# Source: BRD Section 12 / 17
api_documentation_url: https://api.practicesoftwaretesting.com/api/documentation
execution:
  max_vus: MISSING
  max_duration_minutes: MISSING
monitoring:
  enabled: MISSING
credentials_env_vars: []
safety:
